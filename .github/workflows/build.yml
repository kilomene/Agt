name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Materialize client config from repo secrets
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          set -euo pipefail
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > app/google-services.json
          python3 -c "import json; d=json.load(open('app/google-services.json')); assert d['project_info']['project_id']=='agentlink-84609', 'wrong firebase project'; print('google-services.json OK:', d['client'][0]['client_info']['mobilesdk_app_id'])"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Stage native binaries and the Linux bootstrap
        run: |
          set -euo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/assets
          echo "fa10b1a7818c2f5b1dcb5834450570c368c9ecf66d31521509621b95c4538a45  native-binaries/proot-aarch64" | sha256sum -c -
          cat native-binaries/cloudflared-arm64.part* > native-binaries/cloudflared-arm64
          echo "abe54a006acf9faf2d19ee9d953cb0d0804e92f59c5382a162e57b84d086f56f  native-binaries/cloudflared-arm64" | sha256sum -c -
          cp native-binaries/proot-aarch64 app/src/main/jniLibs/arm64-v8a/libproot.so
          cp native-binaries/cloudflared-arm64 app/src/main/jniLibs/arm64-v8a/libcloudflared.so
          # The native Linux layer: the PTY library the shell runs
          # on, and the bootstrap zip (bash + busybox + ncurses,
          # built for this app's own prefix; sources and build
          # scripts in native-binaries/src). The Debian rootfs
          # bundle is gone: Linux is native now, not a guest.
          echo "06aabdf71b7fbcd49e4a858f78f0ccd5d2b7c02777132a9ab81f80b9c8258152  native-binaries/libagtpty.so" | sha256sum -c -
          cp native-binaries/libagtpty.so app/src/main/jniLibs/arm64-v8a/libagtpty.so
          cat native-bootstrap/bootstrap-aarch64.zip.part* > native-bootstrap/bootstrap-aarch64.zip
          echo "b1efb4dd1277e58e068a470b1234f90507e0c921af9d45cc7356aee2e4be535e  native-bootstrap/bootstrap-aarch64.zip" | sha256sum -c -
          cp native-bootstrap/bootstrap-aarch64.zip app/src/main/assets/bootstrap-aarch64.zip
          ls -la app/src/main/jniLibs/arm64-v8a/ app/src/main/assets/

      - name: Materialize the permanent signing keystore
        env:
          AGT_KEYSTORE_B64: ${{ secrets.AGT_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          echo "$AGT_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/agt-signing.p12"
          ls -la "$RUNNER_TEMP/agt-signing.p12"

      - name: Run unit tests and build the debug APK
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TUNNEL_TOKEN: ${{ secrets.TUNNEL_TOKEN }}
          AGT_KEYSTORE_FILE: ${{ runner.temp }}/agt-signing.p12
          AGT_KEYSTORE_PASSWORD: ${{ secrets.AGT_KEYSTORE_PASSWORD }}
        run: gradle :app:testDebugUnitTest :app:assembleDebug --console=plain

      - name: Encrypt the APK for private delivery
        run: |
          set -euo pipefail
          # The built app is never uploaded in the clear. This repo is
          # public, and GitHub lets any signed in user download plain
          # workflow artifacts from a public repo, so the APK is sealed
          # with age to the recipient in .github/artifact-recipient.txt.
          # Only the holder of the matching private key (Nova Inc, kept
          # outside this repo) can open the artifact. Anyone else who
          # downloads it gets an encrypted file, not the app.
          curl -sL -o "$RUNNER_TEMP/age.tar.gz" https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-linux-amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/age.tar.gz" -C "$RUNNER_TEMP" --no-same-owner
          "$RUNNER_TEMP/age/age" -r "$(cat .github/artifact-recipient.txt)" -o app-debug.apk.age app/build/outputs/apk/debug/app-debug.apk
          ls -la app-debug.apk.age

      - name: Upload the encrypted APK (private)
        uses: actions/upload-artifact@v4
        with:
          name: agt-debug-apk
          path: app-debug.apk.age
          if-no-files-found: error

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agt-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
